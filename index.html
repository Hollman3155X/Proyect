<script>
const REMEMBER_KEY = 'bf_remember_v5';

    } catch(e) { return null; }
  },
  setItem: (key, value) => {
    try {
      if (rememberPref()) { localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    } catch(e) {}
  },
  removeItem: (key) => {
    try { localStorage.removeItem(key); sessionStorage.removeItem(key); } catch(e) {}
  }
};

const SUPABASE_URL = 'https://wuapikyjrmxjgwxzxlle.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1YXBpa3lqcm14amd3eHp4bGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTEyNDUsImV4cCI6MjEwNTk4NzI0NX0.7yUzAejH54BJLZJAoboexptddE1n9uKFEMkmM6HTVLs';
const EDGE_URL = 'https://wuapikyjrmxjgwxzxlle.supabase.co/functions/v1/admin-users';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => '$' + Number(n||0).toLocaleString('es-CO');

const parseMoney = (s) => {
  if (s === null || s === undefined) return 0;
  if (typeof s === 'number') return isFinite(s) ? s : 0;
  let str = String(s).trim();
  str = str.replace(/[^\d.,-]/g, '');
  if (str === '' || str === '-' || str === '.' || str === ',') return 0;
  const hasComma = str.includes(',');
  const hasDot = str.includes('.');
  let normalized;
  if (hasComma && hasDot) {
    normalized = str.replace(/\./g, '').replace(',', '.');
  } else if (hasComma) {
    const parts = str.split(',');
    if (parts.length === 2 && parts[1].length === 3) normalized = str.replace(',', '');
    else normalized = str.replace(',', '.');
  } else {
    normalized = str;
  }
  const num = parseFloat(normalized);
  return isNaN(num) ? 0 : num;
};

const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

const todayStr = () => {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};

const toLocalDateStr = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');

};

const confirmar = msg => window.confirm(msg);

function hardResetScroll(){

    window.scrollTo(0, 0);
    document.body.scrollTop = 0;

function isInputFocused(){
  const a = document.activeElement;
  if(!a) return false;
  return a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable === true;
}

function toast(msg, type='success'){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  const icon = type==='success'?'✅':type==='error'?'⚠️':type==='realtime'?'📡':'ℹ️';
  const cls = type==='error' ? 'bg-red-950 text-red-200 border-red-900/60'
    : type==='realtime' ? 'toast-rt'
    : 'bg-slate-900 text-slate-100 border-slate-700';
  el.className = `pointer-events-auto px-5 py-3.5 rounded-2xl border shadow-2xl backdrop-blur-md text-sm font-semibold flex items-center space-x-3 transition-all duration-300 translate-y-4 opacity-0 ${cls}`;
  el.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
  c.appendChild(el);
  setTimeout(()=>el.classList.remove('translate-y-4','opacity-0'),10);
  setTimeout(()=>{el.classList.add('translate-y-4','opacity-0');setTimeout(()=>el.remove(),300);},3000);
}

function exportCSV(coleccion){
  const rows = Store.all(coleccion);
  if(!rows.length){ toast('No hay datos para exportar','error'); return; }
  const omit = ['created_at','updated_at','created_by'];
  const cols = Object.keys(rows[0]).filter(k => !omit.includes(k));
  const header = cols.join(',');
  const body = rows.map(r => cols.map(c => {
    let v = r[c];
    if(v === null || v === undefined) v = '';
    if(typeof v === 'object') v = JSON.stringify(v);
    v = String(v).replace(/"/g,'""');
    return `"${v}"`;
  }).join(',')).join('\n');
  const csv = header + '\n' + body;
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${coleccion}_${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV exportado');
}

function logChange(actor, accion){
  try{
    let log = JSON.parse(localStorage.getItem('bf_changelog_v5')||'[]');
    log.unshift({fecha: new Date().toISOString().slice(0,16).replace('T',' '), actor, accion});
    log = log.slice(0, 50);
    localStorage.setItem('bf_changelog_v5', JSON.stringify(log));
  }catch(e){}
}

let DB_CACHE = {
  clientes: [], locales: [], servicios: [], proyectos: [], tareas: [],
  crm: [], pagos: [], eventos: [], contenido: [], comercial: [], archivos: [], actividad: []
};

async function loadAllData(){
  try {
    const promises = Object.keys(DB_CACHE).map(key =>
      sb.from(key).select('*').order('created_at', { ascending: false })
    );
    const results = await Promise.all(promises);
    const keys = Object.keys(DB_CACHE);
    results.forEach((result, i) => {
      if (result.error) { console.error(`Error cargando ${keys[i]}:`, result.error); DB_CACHE[keys[i]] = []; }
      else { DB_CACHE[keys[i]] = result.data || []; }
    });
  } catch (e) {
    console.error('Error general cargando datos:', e);
    toast('Error cargando datos desde Supabase', 'error');
  }
}

const Store = {
  all(c){ return DB_CACHE[c] || []; },
  find(c,id){ return (DB_CACHE[c] || []).find(x => String(x.id) === String(id)) || null; },
  async add(c, obj, actor){
    const t = new Date().toISOString();
    const record = { ...obj, created_at: t, updated_at: t, created_by: CURRENT_USER?.id || null };
    const { data, error } = await sb.from(c).insert(record).select().single();
    if (error) { console.error(`Error insertando en ${c}:`, error); toast(`Error al guardar: ${error.message || 'revisa los datos'}`, 'error'); return null; }
    if(!DB_CACHE[c].some(x => String(x.id) === String(data.id))) DB_CACHE[c].unshift(data);
    return data;
  },
  async update(c, id, patch, actor){
    const t = new Date().toISOString();
    const { data, error } = await sb.from(c).update({ ...patch, updated_at: t }).eq('id', id).select().single();
    if (error) { console.error(`Error actualizando ${c}:`, error); toast(`Error al actualizar: ${error.message || 'revisa los datos'}`, 'error'); return null; }
    const idx = DB_CACHE[c].findIndex(x => String(x.id) === String(id));
    if (idx !== -1) DB_CACHE[c][idx] = data;
    return data;
  },
  async remove(c, id){
    const { error } = await sb.from(c).delete().eq('id', id);
    if (error) { console.error(`Error eliminando de ${c}:`, error); toast('Error al eliminar en la base de datos', 'error'); return false; }
    DB_CACHE[c] = DB_CACHE[c].filter(x => String(x.id) !== String(id));
    return true;
  }
};

const REALTIME_TABLES = ['clientes','locales','servicios','proyectos','tareas','crm','pagos','eventos','contenido','comercial','archivos','actividad'];

function setRealtimeStatus(status){
  const dot = document.getElementById('realtime-dot');
  const lbl = document.getElementById('realtime-label');
  const ind = document.getElementById('realtime-indicator');
  if(!dot || !lbl) return;
  dot.classList.remove('connected','disconnected','connecting');
  if(status === 'connected'){ dot.classList.add('connected'); lbl.textContent = 'En vivo'; if(ind) ind.classList.add('border-emerald-900/50'); }
  else if(status === 'connecting'){ dot.classList.add('connecting'); lbl.textContent = 'Conectando'; }
  else { dot.classList.add('disconnected'); lbl.textContent = 'Sin conexión'; }
}

function initRealtime(){
  if(REALTIME_CHANNEL) return;
  if(!CURRENT_USER) return;
  if(!navigator.onLine){ setRealtimeStatus('disconnected'); return; }
  setRealtimeStatus('connecting');
  REALTIME_CHANNEL = sb.channel('project-manager-realtime', { config: { broadcast: { self: false } } });
  REALTIME_TABLES.forEach(table => {
    REALTIME_CHANNEL.on('postgres_changes', { event: '*', schema: 'public', table: table }, (payload) => handleRealtimeChange(table, payload));
  });
  let _wasConnected = false;
  REALTIME_CHANNEL.subscribe((status) => {
    if(status === 'SUBSCRIBED'){
      setRealtimeStatus('connected');
      if(_wasConnected === false && sessionStorage.getItem('bf_rt_was_connected')) toast('Conexión en vivo restablecida', 'realtime');
      sessionStorage.setItem('bf_rt_was_connected','1');
      _wasConnected = true;
    } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
      setRealtimeStatus('disconnected'); _wasConnected = false;
    } else { setRealtimeStatus('connecting'); }
  });
}

function startRealtimeHeartbeat(){
  if(REALTIME_HEARTBEAT) return;
  REALTIME_HEARTBEAT = setInterval(() => {
    if(!CURRENT_USER) return;
    if(!navigator.onLine) return;

function stopRealtime(){

function handleRealtimeChange(table, payload){
  const eventType = payload.eventType;
  const newRecord = payload.new;
  const oldRecord = payload.old;
  const isMyChange = (newRecord && CURRENT_USER && (
    String(newRecord.created_by) === String(CURRENT_USER.id) ||
    String(newRecord.updated_by) === String(CURRENT_USER.id) ||
    String(newRecord.user_id) === String(CURRENT_USER.id)
  ));
  if(eventType === 'INSERT'){
    if(newRecord && !DB_CACHE[table].some(x => String(x.id) === String(newRecord.id))){
      DB_CACHE[table].unshift(newRecord);
      if(!isMyChange && table !== 'actividad') showRealtimeToast(`${displayName(table, newRecord)} fue creado por otro usuario`);
    }
  } else if(eventType === 'UPDATE'){
    if(newRecord){
      const idx = DB_CACHE[table].findIndex(x => String(x.id) === String(newRecord.id));
      if(idx !== -1){
        DB_CACHE[table][idx] = newRecord;
        if(!isMyChange && table !== 'actividad') showRealtimeToast(`${displayName(table, newRecord)} fue actualizado por otro usuario`);
      }
    }
  } else if(eventType === 'DELETE'){
    if(oldRecord){
      const existed = DB_CACHE[table].some(x => String(x.id) === String(oldRecord.id));
      DB_CACHE[table] = DB_CACHE[table].filter(x => String(x.id) !== String(oldRecord.id));
      if(existed && !isMyChange && table !== 'actividad') showRealtimeToast(`Un registro fue eliminado por otro usuario`);
    }
  }
  scheduleCurrentRender();
}

function displayName(table, record){
  if(!record) return 'Un registro';
  if(table === 'clientes' || table === 'crm') return record.nombre || 'Un registro';
  if(table === 'locales') return record.nombre || 'Un local';
  if(table === 'servicios') return record.nombre || 'Un servicio';
  if(table === 'proyectos') return record.nombre || 'Un proyecto';
  if(table === 'tareas') return record.titulo || 'Una tarea';
  if(table === 'pagos') return record.servicio || 'Un pago';
  if(table === 'eventos') return record.detalle || 'Un evento';
  if(table === 'contenido') return record.titulo || 'Un contenido';
  if(table === 'comercial') return record.nombre || 'Info comercial';
  if(table === 'archivos') return record.nombre || 'Un archivo';
  return 'Un registro';
}

};

let CURRENT_USER = null;

function can(modulo, action='view'){
  if(!CURRENT_USER) return false;
  const p = PERM_MATRIX[CURRENT_USER.rol];
  if(!p) return false;
  if(action === 'view')  return p.view.includes(modulo);
  if(action === 'edit'){
    if(p.edit === '*') return true;
    return Array.isArray(p.edit) && p.edit.includes(modulo);
  }
  return false;
}

async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const remember = document.getElementById('login-remember').checked;
  try { localStorage.setItem(REMEMBER_KEY, remember ? 'true' : 'false'); } catch(e){}
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { document.getElementById('login-error').classList.remove('hidden'); return; }
  document.getElementById('login-error').classList.add('hidden');
  const user = data.user;
  const { data: perfil } = await sb.from('perfiles').select('*').eq('id', user.id).single();
  const loggedUser = {
    id: user.id, email: user.email,
    nombre: perfil?.nombre_completo || user.email.split('@')[0],
    rol: perfil?.rol || 'colaborador'
  };
  await enterApp(loggedUser);
}

async function doLogout(){
  stopRealtime();
  stopPresence();
  await sb.auth.signOut();
  try {
    Object.keys(localStorage).forEach(k => { if(k.startsWith('sb-')) localStorage.removeItem(k); });
    Object.keys(sessionStorage).forEach(k => { if(k.startsWith('sb-')) sessionStorage.removeItem(k); });
  } catch(e){}
  CURRENT_USER = null;
  DB_CACHE = { clientes: [], locales: [], servicios: [], proyectos: [], tareas: [], crm: [], pagos: [], eventos: [], contenido: [], comercial: [], archivos: [], actividad: [] };
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('login-form').reset();
  document.getElementById('global-search').value='';
  document.getElementById('search-dropdown').classList.add('hidden');
  document.getElementById('sidebar-panel').classList.add('-translate-x-full');
  hardResetScroll();
}

async function enterApp(user){
  CURRENT_USER = user;
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app-view').classList.remove('hidden');
  hardResetScroll();
  setTimeout(hardResetScroll, 100);
  await loadAllData();
  renderSidebar();
  document.getElementById('user-name-display').textContent = user.nombre;
  document.getElementById('user-avatar').textContent = user.nombre.charAt(0).toUpperCase();
  document.getElementById('user-role-display').textContent = ROLE_LABEL[user.rol] || user.rol;
  document.getElementById('header-user-name').textContent = user.nombre;
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  const orden = ['dashboard','clientes','empresas','servicios','pagos','proyectos','tareas','contenido','comercial','calendario','crm','archivos'];

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (!t || t.tagName !== 'INPUT') return;
  const type = (t.type || 'text').toLowerCase();
  if (['submit','button','checkbox','radio','file','hidden','range','color'].includes(type)) return;
  const modalForm = t.closest('#modal-form');
  if (!modalForm) return;
  e.preventDefault();
  e.stopPropagation();
  const fields = Array.from(modalForm.querySelectorAll('input, select, textarea'))
    .filter(el => {
      if (el.disabled) return false;
      if (el.type === 'hidden') return false;
      if (['submit','button','checkbox','radio','file','range','color'].includes(el.type)) return false;
      return true;
    });
  const idx = fields.indexOf(t);
  if (idx !== -1 && idx < fields.length - 1) {
    fields[idx + 1].focus();
  }
}, true);

      const val2 = typeof o==='object'?o.value:o;
      const lab = typeof o==='object'?o.label:o;
      return `<option value="${esc(val2)}" ${arr.includes(val2)?'selected':''}>${esc(lab)}</option>`;
    }).join('')}</select></div>`;
  }
  if(f.type==='file'){
    return `<div><label class="${lbl}">${esc(f.label||'')}</label><input type="file" name="${f.name}" ${f.multiple?'multiple':''} accept="${f.accept||''}" class="w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-600 file:text-white file:font-semibold hover:file:bg-indigo-500"></div>`;
  }
  const minAttr = (f.min!==undefined&&f.min!==null) ? `min="${esc(f.min)}"` : '';
  const maxAttr = (f.max!==undefined&&f.max!==null) ? `max="${esc(f.max)}"` : '';
  return `<div><label class="${lbl}">${esc(f.label||'')}${f.required?' *':''}</label><input type="${f.type||'text'}" name="${f.name}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''} ${minAttr} ${maxAttr} class="${cls}"></div>`;
}

function openForm({title, fields, initial={}, onSubmit, submitLabel='Guardar'}){
  document.getElementById('modal-title').textContent = title;
  const fieldsEl = document.getElementById('modal-fields');
  fieldsEl.innerHTML = fields.map(f=>fieldHTML(f, initial[f.name])).join('');
  document.getElementById('modal-root').classList.remove('hidden');
  document.getElementById('modal-root').classList.add('flex');
  MODAL_CTX.onSubmit = onSubmit;
  setTimeout(()=>{const el = fieldsEl.querySelector('input,select,textarea'); el && el.focus();},50);
}

function closeModal(){
  document.getElementById('modal-root').classList.add('hidden');
  document.getElementById('modal-root').classList.remove('flex');
  document.getElementById('modal-fields').innerHTML = '';
  MODAL_CTX = {type:null,id:null,onSubmit:null};
}

/* ✅ FIX GUARDADO: convierte strings vacíos en null para no fallar en UUID/DATE/NUMBER de Supabase */
async function handleFormSubmit(e){
  e.preventDefault();
  const form = e.target;
  const fields = form.querySelectorAll('input,select,textarea');
  const data = {};
  fields.forEach(el=>{
    if(el.type==='file') return;
    let v;
    if(el.tagName==='SELECT' && el.multiple) v = Array.from(el.selectedOptions).map(o=>o.value);
    else if(el.type==='number'){
      v = el.value==='' ? null : Number(el.value);
      if(v!==null && el.max!=='' && !isNaN(Number(el.max))) v = Math.min(v, Number(el.max));
      if(v!==null && el.min!=='' && !isNaN(Number(el.min))) v = Math.max(v, Number(el.min));
    }
    else v = el.value?.trim ? el.value.trim() : el.value;
    // ✅ Convertir strings vacíos a null (evita error al insertar en columnas UUID/date)
    if(v === '') v = null;
    data[el.name] = v;
  });
  if(MODAL_CTX.onSubmit){
    const ok = await MODAL_CTX.onSubmit(data);
    if(ok !== false) closeModal();
  }
}

async function eliminarCliente(id){
  const c = clienteById(id); if(!c) return;
  const relaciones = [
    { tabla: 'locales',   label: 'local(es)' },
    { tabla: 'proyectos', label: 'proyecto(s)' },
    { tabla: 'tareas',    label: 'tarea(s)' },
    { tabla: 'pagos',     label: 'pago(s)' },
    { tabla: 'crm',       label: 'prospecto(s) CRM' },
    { tabla: 'contenido', label: 'contenido(s)' },
    { tabla: 'comercial', label: 'info comercial' },
    { tabla: 'eventos',   label: 'evento(s)' }
  ];
  const conteos = {};
  relaciones.forEach(r => {
    conteos[r.tabla] = Store.all(r.tabla).filter(x => String(x.cliente_id) === String(id)).length;
  });
  const resumen = relaciones
    .filter(r => conteos[r.tabla] > 0)
    .map(r => `${conteos[r.tabla]} ${r.label}`)
    .join(', ');
  const msg = `¿Eliminar "${c.nombre}"?` +
    (resumen ? `\n\nTambién se eliminarán:\n• ${resumen.replace(/, /g, '\n• ')}` : '') +
    `\n\nEsta acción no se puede deshacer.`;
  if(!confirmar(msg)) return;
  for (const r of relaciones) {
    const items = Store.all(r.tabla).filter(x => String(x.cliente_id) === String(id));
    for (const item of items) {
      await Store.remove(r.tabla, item.id);
    }
  }
  await Store.remove('clientes', id);
  logActivity(`Eliminó cliente "${c.nombre}" y sus datos asociados`);
  renderAll();
}

function barChartSVG(data){
  if(!data.length) return '<div class="text-slate-500 text-center py-8 text-sm">Sin datos</div>';
  const W=380,H=180,pad=30;
  const max = Math.max(...data.map(d=>d.value),1);
  const bw = (W-pad*2)/data.length*0.7;
  const gap = (W-pad*2)/data.length*0.3;
  let bars = '';
  data.forEach((d,i)=>{
    const bh = (d.value/max)*(H-pad*2);
    const x = pad+i*(bw+gap);
    const y = H-pad-bh;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="url(#gBar)"/><text x="${x+bw/2}" y="${H-pad+14}" font-size="9" fill="#94a3b8" text-anchor="middle">${esc(d.label)}</text><text x="${x+bw/2}" y="${y-4}" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="700">${d.value>999?Math.round(d.value/1000)+'k':d.value}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto"><defs><linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4338ca"/></linearGradient></defs><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#334155"/>${bars}</svg>`;
}

function pieChartSVG(data){
  if(!data.length) return '<div class="text-slate-500 text-center py-8 text-sm">Sin datos</div>';
  const total = data.reduce((a,d)=>a+d.value,0);
  const colors = ['#6366f1','#8b5cf6','#10b981','#f59e0b','#ef4444','#0ea5e9','#a855f7','#ec4899'];
  const W=380,H=180,cx=90,cy=H/2,r=65;
  let acc=0, slices='';
  data.forEach((d,i)=>{
    const pct = d.value/total;
    const a0 = acc*2*Math.PI-Math.PI/2;
    const a1 = (acc+pct)*2*Math.PI-Math.PI/2;
    acc += pct;
    const x0 = cx+r*Math.cos(a0), y0 = cy+r*Math.sin(a0);
    const x1 = cx+r*Math.cos(a1), y1 = cy+r*Math.sin(a1);
    const large = pct>0.5?1:0;
    slices += `<path d="M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z" fill="${colors[i%colors.length]}" opacity=".9"/>`;
  });
  const legend = data.map((d,i)=>`<span class="flex items-center gap-2 text-xs text-slate-300"><span class="w-3 h-3 rounded-sm inline-block" style="background:${colors[i%colors.length]}"></span>${esc(d.label)} (${d.value})</span>`).join('');
  return `<div class="flex gap-5 items-center flex-wrap"><svg viewBox="0 0 190 180" style="max-width:180px;"><g>${slices}</g><circle cx="${cx}" cy="${cy}" r="${r*0.5}" fill="#0f172a"/><text x="${cx}" y="${cy+4}" font-size="16" font-weight="800" fill="#e2e8f0" text-anchor="middle">${total}</text></svg><div class="flex flex-col gap-2">${legend}</div></div>`;
}

      try {
        input2.focus({ preventScroll: true });
        input2.setSelectionRange(cursorPos, cursorPos);

    }
  }, 120);
}

function updateClientesGrid(){
  const grid = document.getElementById('clientes-grid');
  if(!grid) return;
  const q = (document.getElementById('search-clientes')?.value || '').toLowerCase();
  const f = (document.getElementById('filter-clientes')?.value || '');
  const list = Store.all('clientes').filter(c=>{
    if(f && c.estado!==f) return false;
    if(q && !(c.nombre.toLowerCase().includes(q)||(c.contacto||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const locales = Store.all('locales');
  if(!list.length){
    grid.innerHTML = `<div class="ui-card rounded-3xl shadow-lg">${emptyState('👥','Sin clientes todavía','Registra tu primer cliente para empezar a gestionar la cartera.','formCliente()','+ Crear cliente')}</div>`;

  grid.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">

  logActivity(`Movió tarea "${t.titulo}" a "${col}"`);
  toast(`Movido a ${col}`); DRAG_TAREA=null;
  renderKanban(); renderDashboard();
}

let VISTA_CAL = 'lista';
let MES_CAL = new Date();
function toggleVistaCal(){ VISTA_CAL = VISTA_CAL==='lista'?'mes':'lista'; renderCalendario(); }
function cambiarMes(d){ MES_CAL.setMonth(MES_CAL.getMonth()+d); VISTA_CAL='mes'; renderCalendario(); }
function renderCalendario(){
  const v = document.getElementById('view-calendario');
  const eventos = Store.all('eventos');
  let content = '';
  if(!eventos.length){
    content = emptyState('📅','Sin eventos en el calendario','Registra eventos, publicaciones, reuniones y vencimientos para verlos aquí.','formEvento()','+ Crear evento');
  } else if(VISTA_CAL === 'mes'){
    const year = MES_CAL.getFullYear(), month = MES_CAL.getMonth();
    const first = new Date(year,month,1);
    const startDay = (first.getDay()+6)%7;
    const daysInMonth = new Date(year,month+1,0).getDate();
    const prevDays = new Date(year,month,0).getDate();
    const dias = [];
    for(let i=startDay-1;i>=0;i--) dias.push({fecha:new Date(year,month-1,prevDays-i),other:true});
    for(let d=1;d<=daysInMonth;d++) dias.push({fecha:new Date(year,month,d),other:false});
    while(dias.length%7!==0) dias.push({fecha:new Date(year,month+1,dias.length-startDay-daysInMonth+1),other:true});
    const hoyStr = todayStr();
    content = `<div class="grid grid-cols-7 gap-1.5 sm:gap-2">${['L','M','X','J','V','S','D'].map(d=>`<div class="text-[10px] sm:text-[11px] font-bold text-center text-slate-500 uppercase py-2 sm:py-3">${d}</div>`).join('')}
      ${dias.map(d=>{
        const f = toLocalDateStr(d.fecha);
        const evs = eventos.filter(e=>e.fecha===f);
        const cls = `cal-day bg-slate-900/60 border rounded-xl p-1.5 sm:p-2.5 text-xs flex flex-col gap-1 overflow-hidden ${d.other?'opacity-30':'border-slate-800'} ${f===hoyStr?'border-indigo-500 border-2':''}`;
        return `<div class="${cls}">

const BUCKET = 'archivos';
const MAX_FILE_SIZE = 50 * 1024 * 1024;
const SIGNED_URL_EXPIRY = 60 * 60;
function formatBytes(bytes){
  if(!bytes) return '0 B';
  const k = 1024;
  const sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes)/Math.log(k));
  return (bytes/Math.pow(k,i)).toFixed(1) + ' ' + sizes[i];
}
function fileIcon(tipo){
  if(!tipo) return '📄';
  if(tipo.startsWith('image/')) return '🖼️';
  if(tipo.startsWith('video/')) return '🎬';
  if(tipo.startsWith('audio/')) return '🎵';
  if(tipo.includes('pdf')) return '📕';
  if(tipo.includes('zip') || tipo.includes('rar')) return '🗜️';
  if(tipo.includes('word') || tipo.includes('document')) return '📘';
  if(tipo.includes('excel') || tipo.includes('sheet')) return '📗';
  return '📄';
}

async function subirArchivos(files){
  if(!files || !files.length) return;
  const progressEl = document.getElementById('upload-progress');
  const progressBar = document.getElementById('progress-bar');
  const progressText = document.getElementById('progress-text');
  const progressPct = document.getElementById('progress-pct');
  progressEl.classList.remove('hidden');
  progressBar.style.width = '0%';
  progressPct.textContent = '0%';
  let completed = 0;
  const total = files.length;
  let errores = 0;
  for (const file of Array.from(files)) {
    if (file.size > MAX_FILE_SIZE) { toast(`"${file.name}" excede ${formatBytes(MAX_FILE_SIZE)}`, 'error'); errores++; completed++; continue; }
    progressText.textContent = `Subiendo: ${file.name}`;
    const pct = Math.round((completed / total) * 100);
    progressBar.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    try {
      const ext = file.name.split('.').pop();
      const baseName = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9_-]/g, '_');
      const fileName = `${Date.now()}_${baseName}.${ext}`;
      const path = `${CURRENT_USER.id}/${fileName}`;
      const { error: uploadError } = await sb.storage.from(BUCKET).upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type });
      if (uploadError) throw uploadError;
      await Store.add('archivos', { nombre: file.name, tipo: file.type, tamano: file.size, path: path }, CURRENT_USER.nombre);
      completed++;
    } catch(e){
      console.error('Error subiendo archivo:', e);
      toast(`Error subiendo "${file.name}": ${e.message}`, 'error');
      errores++;
      completed++;
    }
  }
  progressBar.style.width = '100%';
  progressPct.textContent = '100%';
  setTimeout(() => { progressEl.classList.add('hidden'); progressBar.style.width = '0%'; }, 800);
  if(errores === 0) toast(`${total} archivo(s) subido(s) exitosamente`);
  else toast(`${total - errores} de ${total} archivo(s) subidos`, errores === total ? 'error' : 'success');
  logActivity(`Subió ${total - errores} archivo(s)`);
  renderArchivos();
}
async function eliminarArchivo(id){
  const archivo = Store.find('archivos', id);
  if(!archivo){ toast('El archivo ya no existe', 'error'); renderArchivos(); return; }
  if(!confirmar(`¿Eliminar "${archivo.nombre}"?\n\nEsta acción no se puede deshacer.`)) return;
  let storageOK = true;
  let tableOK = true;
  let errores = [];
  if(archivo.path){
    const { error: storageError } = await sb.storage.from(BUCKET).remove([archivo.path]);
    if(storageError){ console.warn('Error Storage:', storageError); storageOK = false; errores.push('Storage: ' + storageError.message); }
  }
  const { error: tableError } = await sb.from('archivos').delete().eq('id', id);
  if(tableError){ console.error('Error tabla:', tableError); tableOK = false; errores.push('Tabla: ' + tableError.message); }
  else { DB_CACHE.archivos = DB_CACHE.archivos.filter(x => String(x.id) !== String(id)); }
  if(storageOK && tableOK){ toast('Archivo eliminado'); logActivity(`Eliminó el archivo "${archivo.nombre}"`); }
  else if(tableOK){ toast('Eliminado de la lista (no se pudo borrar del storage)', 'error'); }
  else { toast('Error al eliminar: ' + errores.join(' | '), 'error'); return; }
  renderArchivos();
}

async function ejecutarAutomatizaciones(manual){
  if(!CURRENT_USER){ return; }
  if(_autosRanThisSession && !manual) return;
  _autosRanThisSession = true;
  const hoy = todayStr();
  const en7 = toLocalDateStr(addDays(new Date(),7));
  const tag = '🤖';
  let creadas = 0;
  const eventosProx = Store.all('eventos').filter(e => e.fecha >= hoy && e.fecha <= en7);
  for(const e of eventosProx){
    const titulo = `${tag} Preparar publicidad: ${e.detalle}`;
    const yaExiste = Store.all('tareas').some(t => t.titulo === titulo);
    if(yaExiste) continue;
    const res = await Store.add('tareas', { titulo, cliente_id: e.cliente_id, local_id: e.local_id, fecha_limite: e.fecha, estado: 'Pendiente', prioridad: 'alta', descripcion: 'Generada automáticamente por evento próximo (≤7 días).' }, 'Automatización');
    if(res) creadas++;
  }
  for(const t of Store.all('tareas')){
    if(t.estado === 'Hecho') continue;
    if(!t.fecha_limite) continue;
    if(t.fecha_limite >= hoy) continue;
    if(t.prioridad === 'alta') continue;
    await Store.update('tareas', t.id, { prioridad: 'alta' }, 'Automatización');
  }
  if(creadas > 0){ toast(`${creadas} tarea(s) generada(s) por automatizaciones`); try { renderAll(); } catch(e){} }
  else if(manual){ toast('Automatizaciones ejecutadas. Sin cambios nuevos.'); }
}

      <div class="ui-card p-5 sm:p-7 rounded-3xl shadow-lg overflow-x-auto">
        <h3 class="font-bold text-white mb-4">Equipo con acceso (${USERS_CACHE.length})</h3>
        <table class="w-full text-left text-sm">
          <thead><tr class="text-[11px] font-bold text-slate-500 uppercase border-b border-slate-800"><th class="py-3">Usuario</th><th class="py-3">Rol</th><th class="py-3">Último acceso</th>${esDueño?'<th class="py-3">Estado</th>':''}<th class="py-3 text-right">Acciones</th></tr></thead>
          <tbody class="divide-y divide-slate-800/60">
            ${USERS_CACHE.map(u=>{
              const pres = esDueño ? presenciaDe(u.id) : null;
              const enLinea = !!pres;
              const fechaAcceso = u.last_sign_in_at ? new Date(u.last_sign_in_at) : null;
              const accesoTxt = fechaAcceso ? (esDueño
                ? `${fechaAcceso.toLocaleDateString('es-CO')} · ${fechaAcceso.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`
                : fechaAcceso.toLocaleDateString('es-CO')) : 'Nunca';
              const estadoCell = esDueño ? `<td class="py-3.5">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold ${enLinea?'bg-emerald-950 text-emerald-300 border border-emerald-900':'bg-slate-800 text-slate-400 border border-slate-700'}">
                  <span class="w-1.5 h-1.5 rounded-full ${enLinea?'bg-emerald-400 animate-pulse':'bg-slate-500'}"></span>
                  ${enLinea?'En línea':'Desconectado'}
                </span>
                ${enLinea && pres.conectado_desde ? `<div class="text-[10px] text-slate-500 mt-1">desde ${new Date(pres.conectado_desde).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</div>` : ''}
              </td>` : '';
              return `<tr>
                <td class="py-3.5"><div class="text-white font-semibold">${esc(u.nombre_completo || '—')}</div><div class="text-slate-400 text-xs">${esc(u.email)}</div></td>
                <td class="py-3.5"><span class="px-2.5 py-1 text-[10px] font-bold rounded-full bg-slate-800 text-slate-300 uppercase">${ROLE_LABEL[u.rol]||u.rol}</span></td>
                <td class="py-3.5 text-slate-400 text-xs">${accesoTxt}</td>
                ${estadoCell}
                <td class="py-3.5 text-right">${String(u.id) !== String(CURRENT_USER.id) ? `<button onclick="abrirResetPassword('${u.id}')" class="${BTN_SM}" title="Cambiar contraseña">🔑</button><button onclick="abrirCambiarRol('${u.id}')" class="${BTN_SM}" title="Cambiar rol">🎭</button><button onclick="eliminarUsuarioApp('${u.id}')" class="${BTN_SM} hover:bg-red-950/60 hover:text-red-400" title="Eliminar">🗑️</button>` : '<span class="text-slate-500 text-[10px]">Tú</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="ui-card p-5 sm:p-7 rounded-3xl shadow-lg space-y-4">
        <h3 class="font-bold text-white">Información</h3>
        <p class="text-sm text-slate-400">Desde aquí puedes:</p>
        <ul class="text-sm text-slate-400 space-y-2 list-disc list-inside">
          <li>Crear nuevos usuarios con email y contraseña</li>
          <li>Cambiar la contraseña de cualquier usuario</li>
          <li>Cambiar el rol de cualquier usuario</li>
          <li>Eliminar usuarios (excepto tu propia cuenta)</li>
        </ul>
        <div class="border-t border-slate-800 pt-4 mt-4">
          <p class="text-xs text-slate-500">Roles disponibles:</p>
          <div class="flex flex-wrap gap-2 mt-2">${ROLES.map(r=>`<span class="px-2 py-1 rounded-lg bg-slate-800 text-slate-300 text-[10px] font-semibold">${ROLE_LABEL[r]}</span>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="ui-card p-5 sm:p-7 rounded-3xl shadow-lg">
      <h3 class="font-bold text-white mb-4">Historial de cambios de acceso</h3>
      ${(()=>{let log=[];try{log=JSON.parse(localStorage.getItem('bf_changelog_v5')||'[]');}catch(e){} return log.length?log.map(l=>`<div class="py-3 border-b border-slate-800/60 text-xs"><b class="text-white">${esc(l.actor)}</b> — ${esc(l.accion)} <span class="text-slate-500">· ${l.fecha}</span></div>`).join(''):'<div class="text-slate-500 text-center py-6 text-sm">Sin cambios</div>';})()}
    </div>`;
}
function abrirFormUsuario(){
  openForm({
    title: 'Nuevo Usuario',
    fields: [
      {name:'nombre', label:'Nombre completo', required:true, placeholder:'Ej: Laura Méndez'},
      {name:'email', label:'Correo electrónico', type:'email', required:true, placeholder:'laura@proyect.com'},
      {name:'password', label:'Contraseña', type:'password', required:true, placeholder:'Mínimo 6 caracteres'},
      {name:'rol', label:'Rol', type:'select', required:true, options: ROLES.map(r=>({value:r, label:ROLE_LABEL[r]}))}
    ],
    submitLabel: 'Crear usuario',
    async onSubmit(d){
      if(!d.nombre || !d.email || !d.password){ toast('Completa todos los campos','error'); return false; }
      if(d.password.length < 6){ toast('La contraseña debe tener mínimo 6 caracteres','error'); return false; }
      try{
        await callEdge('create', { nombre: d.nombre, email: d.email, password: d.password, rol: d.rol });
        logChange(CURRENT_USER.nombre, `Creó al usuario "${d.email}" con rol ${ROLE_LABEL[d.rol]}`);
        toast('Usuario creado exitosamente'); renderUsuarios();
      }catch(e){ toast('Error: ' + e.message, 'error'); return false; }
    }
  });
}
function abrirResetPassword(userId){
  const u = USERS_CACHE.find(x => String(x.id) === String(userId));
  if(!u) return;
  openForm({
    title: `Cambiar contraseña — ${u.nombre_completo || u.email}`,
    fields: [{name:'new_password', label:'Nueva contraseña', type:'password', required:true, placeholder:'Mínimo 6 caracteres'}],
    submitLabel: 'Cambiar contraseña',
    async onSubmit(d){
      if(!d.new_password || d.new_password.length < 6){ toast('Mínimo 6 caracteres','error'); return false; }
      try{
        await callEdge('update-password', { user_id: userId, new_password: d.new_password });
        logChange(CURRENT_USER.nombre, `Cambió la contraseña de "${u.email}"`);
        toast('Contraseña actualizada'); renderUsuarios();
      }catch(e){ toast('Error: ' + e.message, 'error'); return false; }
    }
  });
}
function abrirCambiarRol(userId){
  const u = USERS_CACHE.find(x => String(x.id) === String(userId));
  if(!u) return;
  openForm({
    title: `Cambiar rol — ${u.nombre_completo || u.email}`,
    initial: { rol: u.rol },
    fields: [{name:'rol', label:'Nuevo rol', type:'select', required:true, options: ROLES.map(r=>({value:r, label:ROLE_LABEL[r]}))}],
    submitLabel: 'Cambiar rol',
    async onSubmit(d){
      try{
        await callEdge('update-rol', { user_id: userId, rol: d.rol });
        logChange(CURRENT_USER.nombre, `Cambió el rol de "${u.email}" a ${ROLE_LABEL[d.rol]}`);
        toast('Rol actualizado'); renderUsuarios();
      }catch(e){ toast('Error: ' + e.message, 'error'); return false; }
    }
  });
}
async function eliminarUsuarioApp(userId){
  const u = USERS_CACHE.find(x => String(x.id) === String(userId));
  if(!u) return;
  if(!confirmar(`¿Eliminar al usuario "${u.nombre_completo || u.email}"?\n\nEsta acción no se puede deshacer.`)) return;
  try{
    await callEdge('delete', { user_id: userId });
    logChange(CURRENT_USER.nombre, `Eliminó al usuario "${u.email}"`);
    toast('Usuario eliminado'); renderUsuarios();
  }catch(e){ toast('Error: ' + e.message, 'error'); }
}

function renderMiCuenta(){
  const v = document.getElementById('view-cuenta');
  if(!v) return;
  v.innerHTML = `
    <div class="${HEADER_VIEW}">
      <div><h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Mi Cuenta</h1><p class="text-slate-400 text-sm mt-2">Cambia tu contraseña.</p></div>
    </div>
    <div class="ui-card p-5 sm:p-7 rounded-3xl shadow-lg max-w-lg space-y-4">
      <div><label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Email</label><input value="${esc(CURRENT_USER.email)}" disabled class="${INPUT} opacity-60"></div>
      <div><label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Nueva contraseña</label><input id="mi-pass-nueva" type="password" placeholder="Déjala vacía si no cambia" class="${INPUT}"></div>
      <button onclick="guardarMiCuenta()" class="${BTN_PRIMARY} w-full">Guardar cambios</button>
      <div id="mi-msg" class="text-xs"></div>
    </div>`;
}
async function guardarMiCuenta(){
  const np = document.getElementById('mi-pass-nueva').value;
  const msg = document.getElementById('mi-msg');
  if(!np || np.length<6){ msg.style.color='#f87171'; msg.textContent='Mínimo 6 caracteres.'; return; }
  const { error } = await sb.auth.updateUser({ password: np });
  if(error){ msg.style.color='#f87171'; msg.textContent = error.message; return; }
  msg.style.color='#34d399'; msg.textContent='Cambios guardados.';
  toast('Cuenta actualizada');
}

async function logActivity(accion){
  try{
    await sb.from('actividad').insert({ user_id: CURRENT_USER?.id || null, user_name: CURRENT_USER?.nombre || '—', accion });
    const { data } = await sb.from('actividad').select('*').order('created_at', { ascending: false }).limit(50);
    DB_CACHE.actividad = data || [];
  }catch(e){ console.warn('No se pudo loguear actividad', e); }
}

function doSearch(q){
  const dd = document.getElementById('search-dropdown');
  if(!q||q.length<2){ dd.classList.add('hidden'); return; }
  const lq = q.toLowerCase();
  const hits = [];
  const push = (sec, editFn, id, tipo, texto, sub) => hits.push({sec, editFn, id, tipo, texto, sub});

  Store.all('clientes').forEach(c=>{ if((c.nombre||'').toLowerCase().includes(lq)||(c.contacto||'').toLowerCase().includes(lq)) push('clientes','editarCliente',c.id,'Cliente',c.nombre,c.estado); });
  Store.all('locales').forEach(l=>{ if((l.nombre||'').toLowerCase().includes(lq)) push('empresas','editarLocal',l.id,'Local',l.nombre,`Cliente: ${clienteName(l.cliente_id)}`); });
  Store.all('servicios').forEach(s=>{ if((s.nombre||'').toLowerCase().includes(lq)) push('servicios','editarServicio',s.id,'Servicio',s.nombre,s.categoria); });
  Store.all('proyectos').forEach(p=>{ if((p.nombre||'').toLowerCase().includes(lq)) push('proyectos','editarProyecto',p.id,'Proyecto',p.nombre,`${clienteName(p.cliente_id)} · ${p.estado}`); });
  Store.all('tareas').forEach(t=>{ if((t.titulo||'').toLowerCase().includes(lq)) push('tareas','editarTarea',t.id,'Tarea',t.titulo,`${clienteName(t.cliente_id)} · ${t.estado}`); });
  Store.all('eventos').forEach(e=>{ if((e.detalle||'').toLowerCase().includes(lq)) push('calendario','editarEvento',e.id,'Evento',e.detalle,`${e.fecha} · ${e.tipo}`); });
  Store.all('pagos').forEach(p=>{ if((p.servicio||'').toLowerCase().includes(lq)) push('pagos','editarPago',p.id,'Pago',`${p.servicio} — ${clienteName(p.cliente_id)}`,`${p.precio} · ${p.estado}`); });
  Store.all('crm').forEach(i=>{ if((i.nombre||'').toLowerCase().includes(lq)) push('crm','editarCRM',i.id,'CRM',i.nombre,i.etapa); });
  Store.all('contenido').forEach(c=>{ if((c.titulo||'').toLowerCase().includes(lq)) push('contenido','editarContenido',c.id,'Contenido',c.titulo,`${c.plataforma} · ${c.estado}`); });
  Store.all('comercial').forEach(c=>{ if((c.nombre||'').toLowerCase().includes(lq)) push('comercial','editarComercial',c.id,'Comercial',c.nombre,`${c.categoria} · ${localName(c.local_id)}`); });

  if(!hits.length){
    dd.innerHTML = `<div class="p-5 text-center text-slate-500 text-sm">Sin resultados para "${esc(q)}"</div>`;
    dd.classList.remove('hidden');
    return;
  }
  const groups = {};
  hits.forEach(h => { (groups[h.tipo] = groups[h.tipo] || []).push(h); });
  dd.innerHTML = `
    <div class="p-4 border-b border-slate-800 text-xs font-bold text-white">${hits.length} resultado(s) para "${esc(q)}"</div>
    ${Object.entries(groups).map(([tipo, items]) => `
      <div class="p-4 border-b border-slate-800/60">
        <div class="text-[10px] font-bold text-slate-500 uppercase mb-2">${tipo} (${items.length})</div>
        ${items.slice(0,5).map(i => `
          <button type="button" onclick="gotoSearchResult('${i.sec}','${i.editFn}','${i.id}')" class="w-full text-left py-2 px-3 rounded-xl hover:bg-slate-800/60 transition flex justify-between items-center gap-3">
            <span class="min-w-0"><span class="text-white font-semibold text-sm block truncate">${esc(i.texto)}</span><span class="text-slate-500 text-xs block truncate">${esc(i.sub || '')}</span></span>
            <span class="text-slate-500 text-xs shrink-0">→</span>
          </button>`).join('')}
      </div>`).join('')}`;
  dd.classList.remove('hidden');
}
function gotoSearchResult(sec, editFn, id){
  document.getElementById('search-dropdown').classList.add('hidden');
  document.getElementById('global-search').value = '';
  switchTab(sec);
  setTimeout(() => { try { window[editFn](id); } catch(e){ console.warn('No se pudo abrir resultado:', e); } }, 300);
}

function renderAll(){
  if(!CURRENT_USER) return;
  renderDashboard();
  if(can('clientes','view')) renderClientes();
  if(can('empresas','view')) renderEmpresas();
  if(can('servicios','view')) renderServicios();
  if(can('pagos','view')) renderPagos();
  if(can('proyectos','view')) renderProyectos();
  if(can('tareas','view')) renderKanban();
  if(can('contenido','view')) renderContenido();
  if(can('comercial','view')) renderComercial();
  if(can('calendario','view')) renderCalendario();
  if(can('crm','view')) renderCRM();
  if(can('archivos','view')) renderArchivos();
  renderMiCuenta();
  renderNotificaciones();
  if(CURRENT_USER.rol==='dueño' || CURRENT_USER.rol==='administrador'){ renderUsuarios(); renderAutomatizaciones(); }
}

checkSession();

window.addEventListener('online', () => { if(CURRENT_USER && !REALTIME_CHANNEL) initRealtime(); });
window.addEventListener('offline', () => setRealtimeStatus('disconnected'));

if('serviceWorker' in navigator){
  let swRefrescando = false;

  // Si el SW activo cambia (nueva versión tomó control), recarga una sola vez.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(swRefrescando) return;
    swRefrescando = true;
    window.location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(reg => {
    // Revisa si hay una versión nueva cada vez que se carga la página
    reg.update().catch(()=>{});

    // Si ya hay un SW esperando (instalado pero no activo), actívalo ya
    if(reg.waiting){
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }

    // Si se detecta una nueva versión mientras el usuario está usando la app
    reg.addEventListener('updatefound', () => {
      const nuevoSW = reg.installing;
      if(!nuevoSW) return;
      nuevoSW.addEventListener('statechange', () => {
        if(nuevoSW.state === 'installed' && navigator.serviceWorker.controller){
          // Hay una versión nueva lista: la activamos automáticamente
          nuevoSW.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });

    // Revisa periódicamente si salió una versión nueva (cada 5 minutos)
    setInterval(() => { reg.update().catch(()=>{}); }, 5 * 60 * 1000);
  }).catch(e => console.warn('SW no registrado:', e));
}
</script>
